<!DOCTYPE html>
<html>
<head>
<title>Solar Admin - Payments & Activation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  padding:15px;
  background:#0f0f0f;
  color:#fff
}

h1{
  color:#00e676
}

.card{
  background:#1e1e1e;
  padding:15px;
  margin:15px 0;
  border-radius:12px;
  border-left:4px solid #00e676;
  animation:pop .3s
}

@keyframes pop{
  0%{transform:scale(.9)}
  100%{transform:scale(1)}
}

button{
  padding:14px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
  width:100%
}

.approve{
  background:#00e676;
  color:#000;
  font-size:18px
}

.reject{
  background:#333;
  color:#ff4444;
  border:1px solid #ff4444
}

.badge{
  background:#00e676;
  color:#000;
  padding:6px 12px;
  border-radius:20px;
  font-weight:bold
}

.top{
  position:sticky;
  top:0;
  background:#0f0f0f;
  padding:10px 0;
  z-index:9
}

.empty{
  color:#777;
  margin-top:30px;
  text-align:center
}
</style>
</head>

<body>

<div class="top">

<h1>⚡ Solar Admin LIVE</h1>

<a href="/" style="color:#00e676">← Site</a>

<br><br>

<span class="badge" id="count">0 pending</span>

-
<span id="status">
🔊 Sound ON - Keep this page open
</span>

<br>

<button
onclick="enableSound()"
style="background:#fff;color:#000;width:auto;padding:8px 15px;margin-top:10px">
🔔 Enable Notifications & Sound
</button>

</div>

<div id="orders">
Waiting for payments...
</div>

<audio
id="beep"
src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
preload="auto">
</audio>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBpeaYd1u9HmPqU5HUKN4oT8FYpMqU5H4oT8FYpM",

  authDomain: "solar-platform-4e199.firebaseapp.com",

  projectId: "solar-platform-4e199",

  storageBucket: "solar-platform-4e199.firebasestorage.app",

  messagingSenderId: "1064154251819",

  appId: "1:1064154251819:web:5825f9e77b361ec8a7e"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let lastCount = 0;

let soundEnabled = false;


/* =========================
   ENABLE SOUND
========================= */

window.enableSound = async()=>{

  soundEnabled = true;

  document.getElementById('beep').play().catch(()=>{});

  if(
    typeof Notification !== "undefined" &&
    Notification.permission !== "granted"
  ){

    await Notification.requestPermission();

  }

  document.getElementById('status').innerText =
    "✅ LIVE - Will beep when payment comes";

  alert(
    "✅ Notifications enabled!\n\nKeep this admin page open."
  );

};


/* =========================
   LOAD PENDING PAYMENTS
========================= */

async function loadOrders(){

  try{

    const snap = await getDocs(
      collection(db,"users")
    );

    let html = "";

    let count = 0;


    snap.forEach(d=>{

      const u = d.data();


      /*
       SHOW ALL PENDING PAYMENTS

       This includes:
       - New users waiting for activation
       - Existing active users making another purchase
      */

      if(u.paymentStatus === "pending"){

        count++;


        const accountStatus =
          u.activated === true
          ? "🟢 ACCOUNT ALREADY ACTIVE"
          : "🔒 ACCOUNT LOCKED";


        const referral =
          u.referredBy || "No referral";


        html += `

        <div class="card">

          <b>👤 ${u.email || ""}</b>

          <br><br>

          <span style="color:#00e676">
          ${accountStatus}
          </span>

          <br><br>

          Product:
          <b>${u.lastPurchase || ""}</b>

          <br>

          Amount:
          <b style="
          color:#00e676;
          font-size:20px">
          ${u.pendingAmount || 0} FCFA
          </b>

          <br>

          MoMo ID:
          <b style="
          color:yellow;
          font-size:22px">
          ${u.momoTransactionId || ""}
          </b>

          <br>

          MyID:
          ${u.myId || ""}

          <br>

          Referred By:
          <b style="color:#ffd700">
          ${referral}
          </b>

          <br><br>

          <button
          class="approve"
          onclick="approveUser('${d.id}')">

          ✅ APPROVE PAYMENT

          </button>

          <button
          class="reject"
          onclick="rejectUser('${d.id}')">

          ❌ REJECT PAYMENT

          </button>

        </div>

        `;

      }

    });


    if(count === 0){

      html =
      "<p class='empty'>😴 No pending payments.<br><br>Waiting for new payment...</p>";

    }


    document.getElementById("orders").innerHTML =
      html;

    document.getElementById("count").innerText =
      count + " pending";


    /* =========================
       NEW PAYMENT NOTIFICATION
    ========================= */

    if(
      count > lastCount &&
      lastCount !== 0 &&
      soundEnabled
    ){

      document.getElementById("beep").play();

      if(navigator.vibrate){

        navigator.vibrate([
          500,
          200,
          500
        ]);

      }

      if(
        typeof Notification !== "undefined" &&
        Notification.permission === "granted"
      ){

        new Notification(
          "💰 New Payment!",
          {
            body:
            count +
            " payment(s) waiting for approval."
          }
        );

      }

    }


    if(
      count > 0 &&
      lastCount === 0 &&
      soundEnabled &&
      count === 1
    ){

      document.getElementById("beep").play();

      if(navigator.vibrate){

        navigator.vibrate([
          500,
          200,
          500
        ]);

      }

    }


    lastCount = count;


  }catch(error){

    console.error(
      "Loading payments error:",
      error
    );

  }

}


/* =========================
   APPROVE PAYMENT
========================= */

window.approveUser = async(id)=>{

  if(
    !confirm(
      "Confirm that you received the MoMo payment?\n\n" +
      "Only approve if you have verified the transaction."
    )
  ){

    return;

  }


  try{

    /*
      Get all users
    */

    const snap = await getDocs(
      collection(db,"users")
    );


    let buyerData = null;


    snap.forEach(d=>{

      if(d.id === id){

        buyerData = d.data();

      }

    });


    if(!buyerData){

      alert(
        "User account could not be found."
      );

      return;

    }


    const buyerRef =
      doc(db,"users",id);


    const wasAlreadyActivated =
      buyerData.activated === true;


    /*
      =========================
      BUYER ACCOUNT
      =========================
    */


    let buyerBalance =
      Number(buyerData.balance || 0);


    let buyerTotalEarned =
      Number(buyerData.totalEarned || 0);


    /*
      Give 1,500F ONLY on first activation.
    */

    if(!wasAlreadyActivated){

      buyerBalance += 1500;

      buyerTotalEarned += 1500;

    }


    await updateDoc(
      buyerRef,
      {

        activated:true,

        paymentStatus:"approved",

        balance:buyerBalance,

        totalEarned:buyerTotalEarned,

        approvedAt:new Date()

      }
    );


    /*
      =========================
      REFERRAL BONUS
      =========================

      Only process referral when
      payment has been approved.
    */


    const referralId =
      buyerData.referredBy;


    if(
      referralId &&
      referralId.trim() !== ""
    ){

      let referrerDoc = null;


      snap.forEach(d=>{

        const u = d.data();


        /*
          Find the user whose MyID
          matches the referral ID.
        */

        if(
          u.myId &&
          u.myId === referralId.trim()
        ){

          referrerDoc = d;

        }

      });


      if(referrerDoc){

        const referrerData =
          referrerDoc.data();


        let referrerBalance =
          Number(
            referrerData.balance || 0
          );


        let referrerTotalEarned =
          Number(
            referrerData.totalEarned || 0
          );


        /*
          DIRECT REFERRAL = 10%
          Based on the approved purchase.
        */

        const purchaseAmount =
          Number(
            buyerData.pendingAmount || 0
          );


        const referralBonus =
          Math.floor(
            purchaseAmount * 0.10
          );


        if(referralBonus > 0){

          referrerBalance +=
            referralBonus;

          referrerTotalEarned +=
            referralBonus;


          await updateDoc(
            doc(
              db,
              "users",
              referrerDoc.id
            ),
            {

              balance:
                referrerBalance,

              totalEarned:
                referrerTotalEarned,

              lastReferralBonus:
                referralBonus,

              lastReferralFrom:
                buyerData.email || "",

              lastReferralAt:
                new Date()

            }
          );

        }

      }

    }


    alert(
      "✅ PAYMENT APPROVED!\n\n" +
      "The account has been activated.\n\n" +
      (
        wasAlreadyActivated
        ? "Existing active account: purchase approved."
        : "1,500F activation bonus added."
      )
    );


    await loadOrders();


  }catch(error){

    console.error(
      "Approval error:",
      error
    );

    alert(
      "❌ Approval failed.\n\n" +
      error.message
    );

  }

};


/* =========================
   REJECT PAYMENT
========================= */

window.rejectUser = async(id)=>{

  if(
    !confirm(
      "Reject this payment?"
    )
  ){

    return;

  }


  try{

    await updateDoc(
      doc(db,"users",id),
      {

        paymentStatus:"rejected",

        /*
          Do not activate a locked account.
        */

        activated:false

      }
    );


    await loadOrders();


  }catch(error){

    console.error(
      "Reject error:",
      error
    );

    alert(
      "❌ Could not reject payment.\n\n" +
      error.message
    );

  }

};


/* =========================
   START
========================= */

loadOrders();

setInterval(
  loadOrders,
  4000
);

</script>

</body>
</html>

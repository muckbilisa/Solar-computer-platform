<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLARIS LUX PRO - GLOBAL</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}.card{background:#15151f;border:1px solid #ffcc00;border-radius:14px;padding:16px;margin:12px 0}.product{background:#1e1e2e;border:1px solid #333;border-radius:12px;padding:14px;margin:8px;text-align:center;width:42%;display:inline-block;vertical-align:top}.btn{background:#ffcc00;color:#000;border:0;padding:12px;border-radius:10px;font-weight:bold;width:100%;cursor:pointer}.btn:disabled{background:#444;color:#888}#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:999;justify-content:center;align-items:center;padding:15px}#modalBox{background:#15151f;padding:20px;border-radius:16px;width:100%;max-width:380px;border:2px solid #ffcc00}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#0a0a0a;color:#fff;box-sizing:border-box}.preview{max-width:100%;border-radius:8px;margin:10px 0;max-height:200px}.uploadBox{border:2px dashed #ffcc00;border-radius:10px;padding:20px;text-align:center;margin:10px 0}</style></head><body>
<h2 style="color:#ffcc00">☀️ SOLARIS LUX PRO - GLOBAL</h2>
<div class="card">WALLET: <b id="balance">0 FCFA</b><br>Status: <b id="status">NOT ACTIVATED</b><div id="act" style="display:none;margin-top:12px"><input id="codeInput" placeholder="Enter Activation Code from Owner"><button class="btn" onclick="checkCode()">ACTIVATE NOW</button><small style="color:#aaa">Get code from Owner after payment to +237 680 100 992</small></div></div>
<div class="card" style="background:#1a1a00">MoMo OWNER: <b style="color:#ffcc00;font-size:18px">+237 680 100 992</b> <button onclick="navigator.clipboard.writeText('+237680100992');alert('Copied: +237 680 100 992')">COPY</button></div>
<div id="products"></div>
<div id="modal"><div id="modalBox"><h3 id="mName"></h3><p>Price: <b id="mPrice" style="color:#ffcc00"></b></p><p>Pay to: <b style="color:#ffcc00">+237 680 100 992</b></p><p style="font-size:13px">1. Pay via MoMo<br>2. Take screenshot<br>3. Upload below</p><div class="uploadBox" onclick="document.getElementById('file').click()">☁️ Tap to upload MoMo screenshot<br><small>PNG, JPG</small><input type="file" id="file" accept="image/*" style="display:none" onchange="preview(event)"></div><img id="prev" class="preview" style="display:none"><button class="btn" id="submitBtn" disabled onclick="submitProof()">Upload Screenshot First</button><button class="btn" style="background:#333;color:#fff;margin-top:8px" onclick="document.getElementById('modal').style.display='none'">Cancel</button></div></div>
<script>
const MOMO="680100992", DISPLAY="+237 680 100 992", FULL="+237680100992", WA="237680100992";
let prods=[{id:1,name:"Panel Mini 10W",price:3000,bonus:1000},{id:2,name:"Charger Portable",price:5000,bonus:1500},{id:3,name:"LED Light 100W",price:10000,bonus:3000},{id:4,name:"Power Bank 10k",price:15000,bonus:5000},{id:5,name:"Home Kit 4 Bulbs",price:20000,bonus:7000},{id:6,name:"Inverter 500W",price:30000,bonus:10000},{id:7,name:"Panel 200W Mono",price:50000,bonus:18000},{id:8,name:"Battery 100Ah",price:85000,bonus:30000},{id:9,name:"Complete Kit - Full Freedom",price:100000,bonus:40000}];
let pend=JSON.parse(localStorage.getItem("solar_pending")||"null"), act=JSON.parse(localStorage.getItem("solar_activated")||"null"), cur=null;
function render(){let h="";prods.forEach(p=>{let isP=pend&&pend.productId==p.id,isA=act&&act.productId==p.id;h+=`<div class="product" style="${isP?'border-color:orange':''}${isA?'border-color:#0f0':''}"><b>${p.name}</b><br><span style="color:#ffcc00">${p.price.toLocaleString()}F</span><br><br>${isP?`<span style="color:orange">⏳ PENDING<br><small>${pend.id}</small></span>`:isA?`<span style="color:#0f0">✅ ACTIVATED</span>`:`<button class="btn" onclick="buy(${p.id})">BUY TO ACTIVATE</button>`}</div>`});document.getElementById("products").innerHTML=h;if(pend){document.getElementById("status").innerHTML=`<span style="color:orange">⏳ PENDING ${pend.id}</span>`;document.getElementById("act").style.display="block";}else if(act){document.getElementById("status").innerHTML=`<span style="color:#0f0">✅ ACTIVATED ${act.name}</span>`;document.getElementById("balance").innerText=(act.bonus+1500).toLocaleString()+" FCFA";document.getElementById("act").style.display="none";}}
function buy(id){cur=prods.find(x=>x.id==id);document.getElementById("mName").innerText=cur.name;document.getElementById("mPrice").innerText=cur.price+" FCFA";document.getElementById("modal").style.display="flex";}
function preview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{document.getElementById("prev").src=x.target.result;document.getElementById("prev").style.display="block";let b=document.getElementById("submitBtn");b.disabled=false;b.innerText="Submit Proof → WhatsApp +237 680 100 992";b.dataset.img=x.target.result;};r.readAsDataURL(f);}
function submitProof(){let id="SOLAR-"+Math.random().toString(36).substr(2,5).toUpperCase();let tx={id,productId:cur.id,name:cur.name,price:cur.price,bonus:cur.bonus,time:Date.now()};localStorage.setItem("solar_pending",JSON.stringify(tx));pend=tx;document.getElementById("modal").style.display="none";let msg=`NEW PAYMENT PENDING!%0AID: ${id}%0AProduct: ${tx.name}%0APrice: ${tx.price}F%0APaid to: ${DISPLAY}%0APlease check MoMo and send me activation code.`;window.open(`https://wa.me/${WA}?text=${msg}`,"_blank");alert(`✅ Proof Submitted!\nID: ${id}\nPaid to: ${DISPLAY}\n\n1. Screenshot sent to WhatsApp\n2. Owner will check MoMo ${DISPLAY}\n3. You will receive code: APPROVE-${id}`);render();}
function checkCode(){let c=document.getElementById("codeInput").value.trim().toUpperCase();if(!pend)return alert("No pending payment");if(c==`APPROVE-${pend.id}`||c==`APPROVE-${pend.id.replace("SOLAR-","")}`||c==MOMO+pend.price||c==FULL+pend.price){localStorage.setItem("solar_activated",JSON.stringify(pend));localStorage.removeItem("solar_pending");act=pend;pend=null;alert(`🎉 ACCOUNT ACTIVATED!\nWelcome Bonus 1,500F + ${act.bonus}F unlocked!\nReferral: ${location.origin}/?invite=${act.id}`);render();}else alert(`❌ Wrong Code!\nAsk owner on WhatsApp ${DISPLAY}\nFor ID ${pend?pend.id:''}, code is APPROVE-${pend?pend.id:'ID'}`);}
render();if(location.search.includes("admin")){let p=prompt("Owner Password (680100992):");if(p==MOMO)alert(pend?`ADMIN\nPending: ${pend.id}\n${pend.name} ${pend.price}F\nTo: ${DISPLAY}\nCode to send user: APPROVE-${pend.id}`:"No pending on this device. Ask user for ID, then send APPROVE-ID");}
</script></body></html>

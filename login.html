<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Solaris Lux Pro</title>
<style>body{margin:0;background:#080808;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{background:#121212;border:1px solid #333;padding:25px;border-radius:14px;width:90%;max-width:350px;text-align:center}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#000;color:white}.btn{width:100%;padding:13px;background:#FFD700;border:0;border-radius:8px;font-weight:bold;margin-top:10px}a{color:#FFD700;text-decoration:none;font-size:13px}</style></head>
<body>
<div class="box">
<h2 style="color:#FFD700">☀️ SOLARIS LUX PRO</h2>
<h3>Welcome Back</h3>
<input id="phone" placeholder="Phone / WhatsApp">
<button class="btn" onclick="login()">LOGIN TO ACCOUNT</button>
<p style="margin-top:15px"><a href="/">Don't have account? Activate & Get 1,500F</a></p>
<p id="msg" style="color:#0f0"></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBs4WixBdZKu3y9a2e2U3Wsju-G1R1lS7Q",authDomain:"solar-computer-platform.firebaseapp.com",projectId:"solar-computer-platform",storageBucket:"solar-computer-platform.firebasestorage.app",messagingSenderId:"1087091852102",appId:"1:1087091852102:web:53d7d0aab6db7d3ff2a92d"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.login=async()=>{
const phone=document.getElementById('phone').value.trim();
if(!phone){alert('Enter phone');return}
const snap=await getDoc(doc(db,"solaris_users",phone));
if(!snap.exists()){alert('Account not found. Please Activate first');location.href='/';return}
localStorage.setItem('solarisUser',JSON.stringify({...snap.data(),phone}));
document.getElementById('msg').innerText='✅ Login Success! Redirecting...';
setTimeout(()=>location.href='/',1000);
}
</script>
</body></html>
